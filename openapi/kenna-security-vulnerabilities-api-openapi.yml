        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_vulnerability_request_body_schema'
    get:
      summary: List Vulnerabilities
      description: 'Returns a list of all of the open vulnerabilities that are associated with active assets.


        To retrieve closed vulnerabilities, use the `filter` query parameter with the value "closed".


        Attribute Value


        Maximum Pages Allowed 20


        Maximum Page Size 500


        Default Page Size 500


        Total Count Present in meta object No


        Page size cannot be set for this API,and is fixed at 500. See the Pagination Section for more details.'
      operationId: list-vulnerabilities
      security:
      - X-Risk-Token: []
      tags:
      - VULNERABILITIES
      parameters:
      - name: filter
        in: query
        required: false
        description: Filter the results based on the filter string
        schema:
          type: string
          enum:
          - closed
          - open
      - name: page
        in: query
        description: The page number from 1 to 20.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
