              type: string
              description: The date a vulnerability needs to be fixed by.
              format: date-time
            last_seen_time:
              type: string
              description: The date a vulnerability was last seen on.
              format: date-time
            notes:
              type: string
              description: Strings may be used to store plain english notes on a vulnerability. Maximum 50,000 characters allowed.
            override_score:
              type: integer
              description: An integer (0 - 100) representing the risk score for a vulnerability. Cisco Vulnerability Management continuously updates risk scores as the threat landscape changes. If you manually override this score, the vulnerability will no longer be updated dynamically. This change cannot be reverted to display the Cisco Security Risk Score, and the change will be logged for audit purposes.
