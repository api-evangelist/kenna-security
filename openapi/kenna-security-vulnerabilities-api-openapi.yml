  /vulnerabilities/bulk:
    put:
      summary: Bulk Update Vulnerabilities
      description: Update multiple vulnerabilities at a time using the bulk update endpoint. Update limit is 30,000 vulnerabilities at a time. By default we will index the vulnerabilities in the background.
      operationId: bulk-update-vulnerability
      security:
      - X-Risk-Token: []
      tags:
      - VULNERABILITIES
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    vulnerabilities_updated: 5
              schema:
                $ref: '#/components/schemas/vulnerabilities_bulk_updated_put_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bulk_update_request_body_schema'
  /vulnerabilities/bulk_delete:
    delete:
      summary: Bulk Delete Vulnerabilities
      description: Delete multiple vulnerabilities at a time. Delete limit is 2,000 vulnerabilities at a time.
      operationId: bulk-delete-vulnerabilities
      security:
      - X-Risk-Token: []
      tags:
      - VULNERABILITIES
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    vulnerabilities_deleted: 3
              schema:
                $ref: '#/components/schemas/vulnerabilities_bulk_delete_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
        '403':
          description: '403'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vulnerability_ids_request_body_schema'
  /vulnerabilities/download_data_zip:
    get:
      summary: Download Zipped Vulnerability Data
      description: 'Will return a gzipped file with the most recent data export of all of your vulnerabilities. In order to arrange for a daily full data export please contact our tech support staff. The format of the uncompressed data, is JSONL, JSON, or XML. This is determined when the technical support staff is contacted.


        For more details, refer to Downloading Export Files.'
      operationId: download-zipped-vuln-data
      security:
      - X-Risk-Token: []
      tags:
      - VULNERABILITIES
      responses:
        '200':
          description: '200'
          content:
            application/gzip:
              schema:
                type: object
                properties:
                  vulnerabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/vulnerability_get_response_schema'
                  meta:
                    type: string
  /vulnerabilities/search:
    get:
      summary: Search Vulnerabilities
      description: 'Filters vulnerabilities by a given set of parameters and returns the filtered vulnerabilities as well as the total number of vulnerabilities in the filtered set.


        By default, only open vulnerabilities with active assets are returned. Each unique parameter is combined using AND while each of values passed in a single array will be combined using OR. For example, if you search for all vulnerabilities with status=["open"] and port=["443", "80"] you will receive all open vulnerabilities that have either port 443 or port 80.


        Attribute Value


        Maximum Pages Allowed 20


        Maximum Page Size 5,000


        Default Page Size 500


        Total Count Present in meta object Yes


        See the Pagination Section for more details.'
      operationId: search-vulnerabilities
      security:
      - X-Risk-Token: []
      tags:
      - VULNERABILITIES
      parameters:
      - name: active_internet_breach[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that have seen trending breach activity.
      - name: application_id
        in: query
        description: The ID of an application to retrieve vulnerabilities for. All other search parameters are ignored if application_id is provided.
        schema:
          type: integer
      - name: asset[id][]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Search for vulnerabilities related to the specified asset IDs.
      - name: asset[max_priority]
        in: query
        description: Find vulnerabilities related to assets with priority levels that are less than or equal to this value.
        schema:
          type: integer
      - name: asset[min_priority]
        in: query
        description: Find vulnerabilities related to assets with priority levels that are greater than or equal to this value.
        schema:
          type: integer
      - name: asset[operating_system][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of the names of the operating systems associated with a set of assets.
      - name: asset[primary_locator][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: 'The primary locator used for an asset. This should be one of the following values: ip_address, hostname, database, url, mac_address, netbios, fqdn, file, or application'
      - name: asset[service_names][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of service names relating to your assets. Make sure all letters are lowercase.
      - name: asset[service_ports][]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: An array of ports relating to your assets.
      - name: asset[service_products][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of service products relating to your assets. Make sure all letters are lowercase.
      - name: asset[service_protocols][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of service protocols relating to your assets. Make sure all letters are lowercase.
      - name: asset[status][]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - inactive
        description: Search for vulnerabilities related to assets with the specified statuses.
      - name: asset[status_set_manually][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: A boolean to indicate whether an asset's active/inactive status was set automatically by Cisco Vulnerability Management or manually by a human.
      - name: asset[tags][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of tag names associated with your assets.
      - name: classification[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - Informational
            - CVE
            - CWE
            - WASC
        description: Find all vulnerabilities matching the specified classifications.
      - name: connector_names[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of connector names related to your vulnerabilities.
      - name: connector_types[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of connector types related to your vulnerabilities.
      - name: custom_fields
        in: query
        schema:
          type: string
        description: 'Search for all vulnerabilities that have a specific custom field and its value.  The proper format for a custom field query is `custom_fields:`, the name of the custom field you are searching on, and the value you are searching for.  For example: `custom_fields:Category[]=good`.<br>Note the following: <ol><li>Testing <code>custom_fields</code> in the "Try It!" pane does not work.</li><li>Use the example above as a guide in <code>curl</code> or some other language.</li><li>To search multiple custom fields, add another query parameter.</li><li>Search must have a value and there is no wildcarding.</li></ol>'
      - name: easily_exploitable[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that have seen high levels of exploitation recently.
      - name: fields
        in: query
        schema:
          type: string
        description: A comma separated list of fields to be returned in the response.
      - name: has_known_exploits[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: '*Deprecated:* Please use the "easily_exploitable" query parameter.'
      - name: has_known_malware[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: '*Deprecated:* Please use the "malware_exploitable" query parameter.'
      - name: id[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Array of vulnerability IDs.
      - name: malware_exploitable[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that have had pieces of malware identified.
      - name: max_risk_meter_score
        in: query
        description: Find all vulnerabilities with risk scores that are less than or equal to this value.
        schema:
          type: integer
      - name: min_risk_meter_score
        in: query
        description: Find all vulnerabilities with risk scores that are greater than or equal to this value.
        schema:
          type: integer
      - name: max_rounded_risk_meter_score
        in: query
        description: Similar to max_risk_meter_score, rounded to the nearest integer.
        schema:
          type: integer
      - name: min_rounded_risk_meter_score
        in: query
        description: Similar to min_risk_meter_score, rounded to the nearest integer.
        schema:
          type: integer
      - name: max_severity
        in: query
        description: Find all vulnerabilities with severity levels that are less than or equal to this value.
        schema:
          type: integer
      - name: min_severity
        in: query
        description: Find all vulnerabilities with severity levels that are greater than or equal to this value.
        schema:
          type: integer
      - name: max_threat
        in: query
        description: Find all vulnerabilities with threat levels that are less than or equal to this value.
        schema:
          type: integer
      - name: min_threat
        in: query
        description: Find all vulnerabilities with threat levels that are greater than or equal to this value.
        schema:
          type: integer
      - name: no_vulnerability_definition_id[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Exclude all vulnerabilities for the identified definition IDs.
      - name: page
        in: query
        description: The page number from 1 to 20.
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: The page size from 1 to 5,000.  Default is 500.
        required: false
        schema:
          type: integer
      - name: pci_related[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that are Payment Card Industry related
      - name: popular_target[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that are popular targets.
      - name: port[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: An array of ports associated with your vulnerabilities.
      - name: platform_types[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - application
            - hardware
            - network
            - operating system
        description: An array of strings to filter by platform type.
      - name: predicted_exploitable[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that have been predicted to be exploited.
      - name: prioritized[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: '*Deprecated:* Please use the "top_priority" query parameter.'
      - name: q
        in: query
        description: 'Additional text search parameters, as documented at: [Cisco Vulnerability Management Search Terms](https://help.kennasecurity.com/hc/en-us/articles/206280593-Cisco-Vulnerability-Management-Search-Terms), section "Vulnerability Terms".  Example q=tag:(mytag+AND+thetag).'
        schema:
          type: string
      - name: remote_code_execution[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that be executed remotely.
      - name: search_id
        in: query
        description: The ID of a risk meter group to retrieve vulnerabilities for. Other parameters are ignored if search_id is provided.
        schema:
          type: integer
      - name: service_ticket_status[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of strings that represent the statuses of all service tickets connected to your vulnerabilities.
      - name: status[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - open
            - closed
            - risk accepted
            - false positive
        description: An array of strings to filter by vulnerability status.
      - name: top_exploit[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: '*Deprecated:* Please use the "active_internet_breach" query parameter.'
      - name: top_priority[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities by those that Cisco Vulnerability Management recommends should be a top priority to fix.
      - name: trending[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering by vulnerabilities that are trending.
      - name: vulnerability_class[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - Web app
            - Host or network
        description: An array of strings for filtering by vulnerability classification.
      - name: vulnerability_definition_id[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Find all vulnerabilities for the identified definition IDs.
      - name: wasc_classification[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array to filter your vulnerabilities by specified WASC classifications.
      - name: zero_day[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering by vulnerabilities that have zero days.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    vulnerabilities:
                    - connectors:
                      - name: Nessus XML
                        id: 1
                        connector_definition_name: Nessus XML
                        vendor: Tenable
                      notes: null
                      fix_id: 73492
                      service_ticket: null
                      created_at: '2020-03-04T01:30:36Z'
                      asset_id: 21741
                      id: 9401144
                      last_seen_time: '2020-02-23T14:46:46.000Z'
                      closed_at: null
                      identifiers:
                      - '58988'
                      due_date: null
                      priority: null
                      port:
                      - 443
                      scanner_vulnerabilities:
                      - port: 443
                        external_unique_id: '58988'
                        open: true
                      scanner_score: 3
                      status: open
                      urls:
                        asset: api.nyc3.us.kennasecurity.com/assets/21741
                      solution: 'Upgrade to PHP version 5.3.12 / 5.4.2 or later.  A ''mod_rewrite''

                        workaround is available as well.'
                      patch: true
                      patch_published_at: null
                      cve_id: CVE-2012-1823
                      cve_description: sapi/cgi/cgi_main.c in PHP before 5.3.12 and 5.4.x before 5.4.2, when configured as a CGI script (aka php-cgi), does not properly handle query strings that lack an = (equals sign) character, which allows remote attackers to execute arbitrary code by placing command-line options in the query string, related to lack of skipping a certain php_getopt for the 'd' case.
                      cve_published_at: '2012-05-11T10:15:00.000Z'
                      description: null
                      wasc_id: null
                      severity: 8
                      threat: 10
                      popular_target: false
                      active_internet_breach: true
                      easily_exploitable: true
                      malware_exploitable: false
                      remote_code_execution: true
                      predicted_exploitable: false
                      platform_types:
