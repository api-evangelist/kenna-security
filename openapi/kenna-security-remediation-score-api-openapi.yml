openapi: 3.2.0
info:
  title: Kenna Platform REMEDIATION SCORE API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: REMEDIATION SCORE
paths:
  /reports/remediation_score:
    get:
      summary: Show Remediation Score
      description: 'Returns Remediation Score, which is a measurement of how well an organization is addressing the risk on a group of assets. This is different than the Risk Score, which is not performance based, but the point-in-time level of risk on a group of assets. Remediation Score is calculated through four metrics on an organization''s vulnerabilities (both open and closed) related to the organization''s assets.


        The four metrics of a Remediation Score are: Coverage, Efficiency, Velocity, and Capacity.


        🚧

        Restricted Access


        This API endpoint is a premium feature, depending on your subscription you may not have access.'
      operationId: check-remediation-score
      security:
      - X-Risk-Token: []
      tags:
      - REMEDIATION SCORE
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    remediation_score:
                      date: '2022-08-24'
                      coverage:
                        value: 15
                      efficiency:
                        value: 63
                      velocity:
                        value: 358
                      capacity:
                        value: 0
                      combined:
                        value: 44
              schema:
                $ref: '#/components/schemas/remediation_score_get_response_schema'
        '403':
          description: '403'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: 'false'
                    error: forbidden
                    message: This feature is not available for your subscription. Please contact your account manager or technical support for further assistance.
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    remediation_score_get_response_schema:
      type: object
      properties:
        remediation_score:
          type: object
          properties:
            date:
              type: string
              format: date
              example: '2022-08-24'
              description: It represents the date to which the remediation score and its subscores correspond.
            coverage:
              type: object
              properties:
                value:
                  type: number
                  example: 15
                  description: Coverage measures the percentage of easily exploitable and active internet breach vulnerabilities you closed.
            efficiency:
              type: object
              properties:
                value:
                  type: number
                  example: 63
                  description: Efficiency measures the percentage of closed vulnerabilities that have Active Internet Breach or Easily Exploitable categorization. Looking at closed vulnerabilities only.
            velocity:
              type: object
              properties:
                value:
                  type: number
                  example: 358
                  description: Velocity measures the Mean Time to Remediate (MTTR) in days for both open and closed vulnerabilities within your organization capped at a year.
            capacity:
              type: object
              properties:
                value:
                  type: number
                  example: 15
                  description: Capacity is a percentage that measures the mean monthly close rate over the last year. It excludes current month.
            combined:
              type: object
              properties:
                value:
                  type: number
                  example: 44
                  description: Combined is a weighted calculation of the above four metrics on an organization's vulnerabilities (both open and closed) related to the organization's assets, which is the Remediation Score. It is a measurement of how well an organization is addressing the risk on a group of assets. This is different than the Risk Score, which is not performance based, but the point-in-time level of risk on a group of assets.
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
