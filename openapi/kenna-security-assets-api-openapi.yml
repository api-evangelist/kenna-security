openapi: 3.2.0
info:
  title: Kenna Platform ASSETS API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: ASSETS
paths:
  /assets:
    get:
      summary: List Assets
      description: 'Returns a list of all active assets with open vulnerabilities.


        To retrieve inactive assets, use the `filter` query parameter with the value "inactive".


        Attribute Value


        Maximum Pages Allowed 20


        Maximum Page Size 500


        Default Page Size 500


        Total Count Present in meta object No


        Page size cannot be set for this API, and is currently fixed at 500 entries. See the Pagination Section for more details.


        This endpoint does not return tag source information. Tag source information is available in the List Tags endpoint.'
      operationId: list-assets
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters:
      - name: filter
        in: query
        required: false
        description: Filter the results based on the filter string
        schema:
          type: string
          enum:
          - inactive
          - active
      - name: page
        in: query
        description: The page number from 1 to 20.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    assets:
                    - id: 183
                      created_at: '2015-08-06T12:37:54Z'
                      last_seen_time: '2015-08-12T15:00:54Z'
                      operating_system: null
                      last_booted_at: null
                      ipv6: null
                      locator: http://www.example.com
                      primary_locator: url
                      network_ports:
                      - id: 600002
                        protocol: TCP
                        port_number: 8080
                        name: http
                        product: tomcat
                        version: 7.0.61
                        state: running
                        ostype: windows
                      tags:
                      - nihil
                      - facilis
                      - quo
                      vulnerabilities_count: 1
                      inactive_at: '2020-10-31'
                      status_set_manually: false
                      overage: false
                      urls:
                        vulnerabilities: https://api.kennasecurity.com/assets/183/vulnerabilities
                      notes: null
                      priority: 1
                      hostname: null
                      mac_address: null
                      ec2: null
                      external_id: null
                      netbios: null
                      fqdn: null
                      ip_address: 127.0.0.1
                      url: null
                      file: null
                      database: null
                      application: null
                      risk_meter_score: 0
                      asset_groups:
                      - id: 1
                        name: name
                      status: active
                      owner: Freddy
                    meta:
                      page: 1
                      pages: 30
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/assets_get_response_schema'
                  meta:
                    $ref: '#/components/schemas/page_metadata'
    post:
      summary: Create Asset
      description: Creates a single asset and returns the record.
      operationId: create-asset
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters: []
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    asset:
                      id: 183
                      created_at: '2017-05-30T15:50:21Z'
                      operating_system: null
                      last_booted_at: null
                      ipv6: null
                      locator: 54.38.148.231
                      primary_locator: ip_address
                      vulnerabilities_count: 0
                      inactive_at: '2020-10-31'
                      status_set_manually: false
                      overage: false
                      urls:
                        vulnerabilities: https://api.kennasecurity.com/assets/183/vulnerabilities
                      priority: null
                      notes: null
                      hostname: null
                      mac_address: null
                      external_id: null
                      netbios: null
                      fqdn: null
                      ip_address: 54.38.148.231
                      url: null
                      database: null
                      file: null
                      application: null
                      risk_meter_score: 0
                      asset_groups:
                      - id: 1
                        name: name
                      ec2: null
                      last_seen_time: null
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/assets_get_response_schema'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: 'false'
                    error: unproccessable_entity
                    message: 'param is missing or the value is empty: asset'
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset_request_body_schema'
  /assets/bulk:
    put:
      summary: Bulk Update Assets
      tags:
      - ASSETS
      description: 'Update multiple assets at one time using the bulk update endpoint. Update limit is 30,000 assets at a time.


        By default, we will index the assets in the background. To index your assets synchronously, pass in the realtime parameter and set it to true.


        In addition to the standard attributes on the "asset" parameter, you can also provide a "remove_tags" param: an array of strings that represent tags you would like removed, and a "reset_tags" param: a boolean value set to true if you would like to completely clear tags for each asset. If "reset_tags" is true, all tags will be removed from the assets regardless of source.'
      operationId: bulk-update-assets
      security:
      - X-Risk-Token: []
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    assets_updated: 100
              schema:
                $ref: '#/components/schemas/assets_updated_put_response_schema'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assets_bulk_request_body_schema'
  /assets/download_data_zip:
    get:
      summary: Download Zipped Asset Data
      description: 'Returns a gzipped file with the most recent data export of all of your assets. To arrange for a daily full data export, contact support. The format of the uncompressed data, is JSONL, JSON, or XML. This is determined when when you contact support.


        For more details, refer to Downloading Export Files.'
      operationId: download-zipped-asset-data
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      responses:
        '200':
          description: '200'
          content:
            application/gzip:
              schema:
                $ref: '#/components/schemas/assets_zip_get_response_schema'
  /assets/search:
    get:
      summary: Search Assets
      description: 'Filters assets by a given set of input parameters and returns the filtered assets and the total number of assets in the filtered set. By default, only active assets with open vulnerabilities are returned.


        Each unique parameter is combined using AND while each value passed in a single array will be combined using OR. For example, if you search for all assets with status[]=["active"] and tags[]=["foo", "bar"] you will receive all active assets that have either a "foo" tag or a "bar" tag.


        Attribute Value


        Maximum Pages Allowed 20


        Maximum Page Size 50,000


        Default Page Size 500


        Total Count Present in meta object Yes


        Large page size can cause performance issues. See the Pagination Section for more details.


        This endpoint does not return tag source information. Tag source information is available in the List Tags endpoint.'
      operationId: search-assets
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters:
      - name: application_id
        in: query
        description: The ID of an application to retrieve assets for. All other search parameters are ignored if application_id is provided.
        schema:
          type: integer
      - name: exclude_child_filter[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - Include all assets
            - Assets without Vulnerabilities
        description: '"Include all assets" includes all assets regardless of the vulnerability filters. "Assets without Vulnerabilities" will return only the assets without vulnerabilities. If this parameter is omitted, then the vulnerability filters are used.'
      - name: id[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Array of asset IDs
      - name: max_priority
        in: query
        description: Search for all assets that have a priority that is less than or equal to this value.
        schema:
          type: integer
      - name: min_priority
        in: query
        description: Search for all assets that have a priority that is greater than or equal to this value.
        schema:
          type: integer
      - name: max_risk_meter_score
        in: query
        description: Search for all assets that have a risk meter score that is less than or equal to this value.
        schema:
          type: integer
      - name: min_risk_meter_score
        in: query
        description: Search for all assets that have a risk meter score that is greater than or equal to this value.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number from 1 to 20.
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: The page size from 1 to 50,000.  Default page size is 500. A page size of 5,000 is recommended.  Larger page sizes can cause performance issues.
        required: false
        schema:
          type: integer
      - name: operating_system[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of the names of the operating systems associated with a set of assets.
      - name: primary_locator[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: 'The primary locator used for an asset. This should be one of the following values: ip_address, hostname, database, url, mac_address, netbios, fqdn, file, or application'
      - name: q
        in: query
        description: 'Additional text search parameters, as documented at: [Cisco Vulnerability Management Search Terms](https://help.kennasecurity.com/hc/en-us/articles/206280593-Kenna-Search-Terms), section "Asset Terms".  Example q=tag:(mytag+AND+thetag).'
        schema:
          type: string
      - name: service_names[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of service names related to your assets. Make sure all letters are lowercase.
      - name: service_ports[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: An array of ports related to your assets.
      - name: service_products[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of service products related to your assets. Make sure all letters are lowercase.
      - name: service_protocols[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of service protocols related to your assets. Make sure all letters are lowercase.
      - name: status[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - inactive
        description: 'An array of statuses for your assets which can include active and/or inactive. Note: By default, only active assets are returned when searching. You must specify the asset status you want in order to override that default.'
      - name: status_set_manually[]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: A boolean to indicate whether an asset's active/inactive status was set automatically by Cisco Vulnerability Management or manually by a human.
      - name: search_id
        in: query
        description: Search values specified in the risk meter group definition will override their respective values provided in this request when search_id is provided.
        schema:
          type: integer
      - name: tag_boolean_mode
        in: query
        description: Set this to 'all' if you would like to return assets that contain all of the tags in your query rather than assets that contain any of the tags.
        schema:
          type: string
      - name: tags[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: An array of tag names associated with your assets.
      - name: vulnerability[classification][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Classification of the vulnerability.
      - name: vulnerability[connector_names][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Connector names of the vulnerabilities.
      - name: vulnerability[connector_types][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Connector types of the vulnerabilities.
      - name: vulnerability[has_known_exploits][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that have known exploits.
      - name: vulnerability[has_known_malware][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that have known malware.
      - name: vulnerability[id][]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Vulnerability IDs.
      - name: vulnerability[max_risk_meter_score]
        in: query
        description: Vulnerability risk scores that are less than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[max_rounded_risk_meter_score]
        in: query
        description: Vulnerability risk scores rounded to the integer that is less than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[max_severity]
        in: query
        description: Vulnerabilities with severity levels that are less than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[max_threat]
        in: query
        description: Vulnerabilities with threat levels that are less than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[min_risk_meter_score]
        in: query
        description: Vulnerability risk scores that are greater than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[min_rounded_risk_meter_score]
        in: query
        description: Vulnerability risk scores rounded to the integer that is greater than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[min_severity]
        in: query
        description: Vulnerabilities with severity levels that are greater than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[min_threat]
        in: query
        description: Vulnerabilities with threat levels that are greater than or equal to this value.
        schema:
          type: integer
      - name: vulnerability[no_vulnerability_definition_id][]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Exclude Vulnerability IDs.
      - name: vulnerability[pci_related][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that are Payment Card Industry related.
      - name: vulnerability[port][]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Ports associated with vulnerabilies.
      - name: vulnerability[predicted_exploitable][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that are predicted to be exploitable.
      - name: vulnerability[prioritized][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that are prioritized.
      - name: vulnerability[q]
        in: query
        description: Vulnerability query string.
        schema:
          type: string
      - name: vulnerability[remote_code_execution][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that can be executed remotely.
      - name: vulnerability[service_ticket_status][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Vulnerability ticket status.
      - name: vulnerability[status][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Vulnerability status.
      - name: vulnerability[top_exploit][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that are actively being used for internet breaches.
      - name: vulnerability[top_priority][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: An array of booleans for filtering your vulnerabilities that Cisco recommends should be a top priority to fix.
      - name: vulnerability[trending][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that are trending.
      - name: vulnerability[vulnerability_class][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Vulnerability classification.
      - name: vulnerability[vulnerability_definition_id][]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Vulnerability definition IDs.
      - name: vulnerability[wasc_classification][]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Vulnerability WASC classification.
      - name: vulnerability[zero_day][]
        in: query
        schema:
          type: array
          items:
            type: boolean
        description: Vulnerabilities that have zero day exploits.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    assets:
                    - id: 183
                      created_at: '2015-08-06T12:37:54Z'
                      last_seen_time: '2015-08-12T15:00:54Z'
                      operating_system: null
                      last_booted_at: null
                      ipv6: null
                      locator: http://www.example.com
                      primary_locator: url
                      network_ports:
                        id: 600002
                        protocol: TCP
                        port_number: 8080
                        name: http
                        product: tomcat
                        version: 7.0.61
                        state: running
                        ostype: windows
                      tags:
                      - nihil
                      - facilis
                      - quo
                      vulnerabilities_count: 1
                      inactive_at: '2020-10-31'
                      status_set_manually: false
                      overage: false
                      urls:
                        vulnerabilities: https://api.kennasecurity.com/assets/183/vulnerabilities
                      notes: null
                      priority: 1
                      hostname: null
                      mac_address: null
                      ec2: null
                      external_id: null
                      netbios: null
                      fqdn: null
                      ip_address: 127.0.0.1
                      url: null
                      file: null
                      database: null
                      application: null
                      risk_meter_score: 0
                      asset_groups:
                      - id: 1
                        name: name
                      status: active
                      owner: Freddy
                    meta:
                      total_count: 800
                      page: 1
                      pages: 2
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/assets_get_response_schema'
                  meta:
                    $ref: '#/components/schemas/page_metadata'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /assets/validate_search:
    get:
      summary: Validate Asset Search Query
      description: Validate the query string portion of an asset search. If the query is invalid and if the system can determine a suggested replacement, that suggestion will be returned in the response.
      operationId: validate-asset-search-query
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters:
      - name: q
        in: query
        description: This is the q string to be validated. For more detailed documenation, visit [Cisco Vulnerability Management Search Terms](https://help.kennasecurity.com/hc/en-us/articles/206280593-Kenna-Search-Terms), section "Asset Terms".
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/valid_asset_search_get_response_schema'
        '422':
          description: '422'
  /assets/{id}:
    put:
      summary: Update Asset
      description: Update a single asset's attributes by ID.
      operationId: update-asset
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters:
      - name: id
        in: path
        description: The asset ID.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: '204'
        '404':
          description: '404'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset_request_body_schema'
    get:
      summary: Show Asset
      description: Returns information about a single asset by ID. This endpoint does not return tag source information. Tag source information is available in the List Tags endpoint.
      operationId: show-asset
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters:
      - name: id
        in: path
        description: The asset ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    asset:
                      id: 183
                      created_at: '2013-09-24T15:50:21Z'
                      last_seen_time: '2013-09-30T20:00:30Z'
                      operating_system: null
                      last_booted_at: null
                      ipv6: null
                      locator: http://www.example.com
                      primary_locator: url
                      network_ports:
                      - id: 600002
                        protocol: TCP
                        port_number: 8080
                        name: http
                        product: tomcat
                        version: 7.0.61
                        state: running
                        ostype: windows
                      tags:
                      - nihil
                      - facilis
                      - quo
                      vulnerabilities_count: 1
                      inactive_at: '2020-10-31'
                      status_set_manually: false
                      overage: false
                      urls:
                        vulnerabilities: https://api.kennasecurity.com/assets/183/vulnerabilities
                      notes: null
                      priority: 1
                      hostname: null
                      mac_address: null
                      ec2: null
                      external_id: null
                      netbios: null
                      fqdn: null
                      ip_address: 127.0.0.1
                      url: null
                      file: null
                      database: null
                      application: null
                      risk_meter_score: 0
                      asset_groups:
                      - id: 1
                        name: name
                      status: active
                      owner: Freddy
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/assets_get_response_schema'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                asset_not_found:
                  value:
                    error: Bad Request
                    message: Cannot find specified asset.
                    success: 'false'
              schema:
                $ref: '#/components/schemas/error_response'
  /assets/{id}/vulnerabilities:
    get:
      summary: Show Asset Vulnerabilities
      description: Returns all vulnerabilities for a single asset.
      operationId: show-asset-vulnerabilities
      security:
      - X-Risk-Token: []
      tags:
      - ASSETS
      parameters:
      - name: id
        in: path
        description: The asset ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    vulnerabilities:
                    - id: 121201
                      closed: true
                      closed_at: '2015-02-10T10:50:17Z'
                      status: closed
                      created_at: '2015-02-10T10:50:17Z'
                      last_seen_time: '2015-02-15T10:25:17Z'
                      notes: null
                      priority: 0
                      score: 15
                      threat: 10
                      severity: 5
                      solution: A type confusion vulnerability can occur when manipulating JavaScript objects due to issues in Array.pop. This can allow for an exploitable crash. We are aware of targeted attacks in the wild abusing this flaw. This vulnerability affects Firefox ESR &lt; 60.7.1, Firefox &lt; 67.0.3, and Thunderbird &lt; 60.7.2.
                      identifiers:
                      - '86847'
                      urls:
                        asset: https://api.kennasecurity.com/asset/536
                      patch: false
                      patch_published_at: null
                      description: null
                      cve_id: CVE-2007-6750
                      wasc_id: null
                      asset_id: 536
                      first_found_on: '2009-06-20T18:12:08Z'
                      easily_exploitable: false
                      platform_types:
                      - hardware
                      malware_exploitable: false
                      top_priority: false
                      active_internet_breach: false
                      popular_target: false
              schema:
                type: object
                properties:
                  vulnerabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/vulnerability_get_response_schema'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: 'false'
                    error: not_found
                    message: Asset not found.
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    page_metadata:
      type: object
      properties:
        meta:
          type: object
          required:
          - page
          - pages
          properties:
            page:
              type: integer
              description: The response current page number.
              default: 1
            pages:
              type: integer
              description: The total number of pages.
              default: 1
            total_count:
              type: integer
              description: The total number of items across all pages.
              default: 1
    valid_asset_search_get_response_schema:
      type: object
      properties:
        valid:
          type: boolean
          example: true
          default: true
        query:
          type: string
          example: os:solaris AND tag:chicago
          default: ''
        suggested_query:
          type: string
    error_response:
      type: object
      properties:
