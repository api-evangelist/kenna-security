openapi: 3.2.0
info:
  title: Kenna Platform APPLICATION REPORTING API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: APPLICATION REPORTING
paths:
  /applications/{id}/report_query/findings/historical_mean_time_to_remediate_by_risk_level:
    get:
      summary: Historical Mean Time To Remediate Findings by Risk Level
      description: Returns a list of the historical Mean Time To Remediate (MTTR) findings by Risk Level for the application ID provided.
      operationId: application-findings-historical-mean-time-to-remediate-by-risk-level
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATION REPORTING
      parameters:
      - name: id
        in: path
        description: The application ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: name
                    mttr:
                      High Risk Findings: 30
                      Medium Risk Findings: 27
                      Low Risk Findings: 5
              schema:
                $ref: '#/components/schemas/applications_findings_mttr_get_response_schema'
        '403':
          description: '403'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /applications/{id}/report_query/historical_mean_time_to_remediate_by_risk_level:
    get:
      summary: Historical Mean Time To Remediate Vulnerabilities by Risk Level
      description: Returns a list of the historical Mean Time To Remediate (MTTR) vulnerabilities by Risk Level for the application ID provided.
      operationId: application-historical-mean-time-to-remediate-by-risk-level
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATION REPORTING
      parameters:
      - name: id
        in: path
        description: The application ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: name
                    mttr:
                      High Risk Vulns: 30
                      Medium Risk Vulns: 27
                      Low Risk Vulns: 5
              schema:
                $ref: '#/components/schemas/applications_vuln_mttr_get_response_schema'
        '403':
          description: '403'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /applications/{id}/report_query/historical_open_vulnerability_count_by_risk_level:
    get:
      summary: Historical Vulnerability Risk Category Counts
      description: Returns a list of the historical Vulnerability Risk Category ("High", "Medium", "Low") counts for the Application ID provided. This endpoint returns "all time" data for the specified Application. The return data is in floating point, for example, 16.0.
      operationId: application-historical-vulnerability-count-by-risk-level
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATION REPORTING
      parameters:
      - name: id
        in: path
        description: The application ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: name
                    historical_vulnerability_count_by_risk:
                      '2020-05-04':
                        low: 4
                        medium: 18
                        high: 21
                      '2019-05-05':
                        low: 4
                        medium: 18
                        high: 12
                      '2019-05-06':
                        low: 4
                        medium: 11
                        high: 0
              schema:
                $ref: '#/components/schemas/applications_historical_vuln_counts_by_risk_level_schema'
        '403':
          description: '403'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    vuln_mttr_schema:
      type: object
      description: Vulnerability Mean Time to Remediate.
      properties:
        High Risk Vulns:
          type: integer
          description: The historical mean time to remediate for high risk vulnerabilities in days.
          example: 30
        Medium Risk Vulns:
          type: integer
          description: The historical mean time to remediate for medium risk vulnerabilities in days.
          example: 48
        Low Risk Vulns:
          type: integer
          description: The historical mean time to remediate for low risk vulnerabilities in days.
          example: 121
    applications_historical_vuln_counts_by_risk_level_schema:
      type: object
      properties:
        id:
          type: integer
          description: The application ID.
          example: 2
        name:
          type: string
          description: The application name.
          example: Engineering Demo App
        historical_vulnerability_count_by_risk:
          $ref: '#/components/schemas/low_medium_high_counts_schema'
    applications_vuln_mttr_get_response_schema:
      type: object
      properties:
        id:
          type: integer
          description: The application ID.
          example: 2
        name:
          type: string
          description: The application name.
          example: Engineering Demo App
        mttr:
          $ref: '#/components/schemas/vuln_mttr_schema'
    low_medium_high_counts_schema:
      type: object
      description: The key is a year, month, and day (YYYY-MM-DD).
      additionalProperties:
        type: object
        properties:
          low:
            type: number
            format: float
            description: The low count.
            example: 125
          medium:
            type: number
            format: float
            description: The medium count.
            example: 75
          high:
            type: number
            format: float
            description: The high count.
            example: 25
    findings_mttr_schema:
      type: object
      description: Findings Mean Time to Remediate.
      properties:
        High Risk Findings:
          type: integer
          description: The historical mean time to remediate for high risk vulnerabilities in days.
          example: 30
        Medium Risk Findings:
          type: integer
          description: The historical mean time to remediate for medium risk vulnerabilities in days.
          example: 48
        Low Risk Findings:
          type: integer
          description: The historical mean time to remediate for low risk vulnerabilities in days.
          example: 121
    applications_findings_mttr_get_response_schema:
      type: object
      properties:
        id:
          type: integer
          description: The application ID.
          example: 2
        name:
          type: string
          description: The application name.
          example: Engineering Demo App
        mttr:
          $ref: '#/components/schemas/findings_mttr_schema'
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
