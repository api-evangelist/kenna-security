info:
  title: Kenna Inference INFERENCE V3 - Osquery API
  description: Swagger POC
  version: '2.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.inference.us.kennasecurity.com
tags:
- name: INFERENCE V3 - Osquery
paths:
  /inference/v3/os_query:
    post:
      summary: Vulnerability Inference for Windows, Darwin (macOS) and Linux Systems
      description: 'Returns a list of known vulnerabilities for a given operating system such as Windows, Mac OS and Linux Systems.


        🚧

        Restricted Access


        This API endpoint is a premium feature for select partners.


        To generate a payload on the client machine, please review the Getting Started with Vulnerability Inference V3 guides, and select your client operating system. For example, for Darwin Systems (macOS), run this osquery command from your command line shell:

        osqueryi --json "SELECT * FROM os_version;"


        The command should produce JSON output that looks like this:

        [

        {

        "major": "10",

        "name": "Mac OS X",

        "platform_like": "darwin",

        "patch": "3",

        "platform": "darwin",

        "version": "10.15.1",

        "build": "19D76",

        "codename": "",

        "arch": "x86_64",

        "minor": "15"

        }

        ]


        The above output can be used in the POST request.'
      operationId: v3-os-inference
      security:
      - X-Risk-Token: []
      tags:
      - INFERENCE V3 - Osquery
      parameters: []
      responses:
