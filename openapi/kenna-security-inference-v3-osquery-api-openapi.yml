components:
  schemas:
    linux_os_inference_request_body_schema:
      type: array
      items:
        type: object
        properties:
          arch:
            type: string
            example: x86_64
            description: OS or package architecture
          build:
            type: string
            example: ''
            description: Optional build-specific or variant string
          codename:
            type: string
            example: ''
            description: OS version codename
          major:
            type: string
            example: '8'
            description: Major release version
          minor:
            type: string
            example: '4'
            description: Minor release version
          name:
            type: string
            example: Rocky Linux
            description: Distribution, product or package name
          patch:
            type: string
            example: '0'
            description: Optional patch release
          platform:
            type: string
            enum:
            - rhel
            - ubuntu
            - amzn
            - sles
            - opensuse-leap
            - alma
            - oracle
            example: rhel
            description: OS Platform or ID
          platform_like:
            type: string
            example: rhel
            description: Closely related platforms
