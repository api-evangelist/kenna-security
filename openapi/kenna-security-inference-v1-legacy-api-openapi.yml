      default: api.inference.us.kennasecurity.com
tags:
- name: INFERENCE V1 (Legacy)
paths:
  /vulnerability_definitions/app_inference:
    post:
      summary: Vulnerability Inference for Applications
      description: 'Returns a list of known vulnerabilities for a given list of applications. Supported operating systems include CentOS, SUSE Linux Enterprise Server, Redhat Enterprise Linux, Ubuntu and Windows.


        🚧

        Restricted Access


        This API endpoint is a premium feature for select partners.'
      operationId: application-inference
      security:
      - X-Risk-Token: []
      tags:
      - INFERENCE V1 (Legacy)
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/51612701083eea34cbeb0be66175b235566839e2376216d7ff4bab8b393d98fd_post_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app_inference_request_body_schema'
