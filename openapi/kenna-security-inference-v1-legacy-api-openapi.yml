components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    os_inference_request_body_schema:
      type: object
      required:
      - os_type
      - os_version
      properties:
        arch:
          type: string
          description: The architecture of the operating system. Currently only `64-bit` is supported. This parameter can be omitted for Linux.
        os_type:
          type: string
          description: The operating system type. Supported values include CENTOS, SLES, RHEL, UBUNTU or WINDOWS.
        os_name:
          type: string
          description: A human readable name for the operating system.
        os_version:
          type: string
          description: The version of the Linux or Windows operating system to check. See below for a list of supported Windows operating systems.
        min_risk_meter_score:
          type: integer
          description: The minimum risk meter score for vulns to be returned; will not return any vulns with risk meter scores less than this value. A min_risk_meter_score of zero will return all vulns.
        include_unverified_versions:
          type: boolean
          description: Whether or not to include inference results for Windows OSes whose data quality results have not yet been verified by our research team. Does not include results for those versions by default.
        installed_kbs:
          type: array
          description: 'List of KBs installed on the operating system. e.g: ["KB5005043", "KB5004948"]'
          items:
            type: string
    app_inference_request_body_schema:
      type: object
      required:
      - os_type
      - os_version
      - software
      properties:
        arch:
          type: string
          description: The architecture of the operating system. Currently only `64-bit` is supported. This parameter can be omitted for Linux.
        os_type:
          type: string
          description: The operating system type. Supported values include CENTOS, SLES, RHEL, UBUNTU or WINDOWS.
        os_name:
          type: string
          description: A human readable name for the operating system.
        os_version:
          type: string
          description: The version of the Linux or Windows operating system to check. See below for a list of supported Windows operating systems.
        software:
          type: array
          description: A list of the applications to check for vulnerabilities
          items:
            type: object
            properties:
              checksum:
                type: string
                description: A checksum for the Windows application or Linux package. This should be unique within the API request.
              vendor:
                type: string
                description: The application's vendor.
              product:
                type: string
                description: The name of the Windows application or Linux package.
              version:
                type: string
                description: The version of the Windows application or Linux package to check.
              release:
                type: string
                description: 'The release version of the Linux package to check. Note: this is field should be omitted for Windows applications.'
        min_risk_meter_score:
          type: integer
          description: The minimum risk meter score for vulns to be returned; will not return any vulns with risk meter scores less than this value. A min_risk_meter_score of zero will return all vulns.
