openapi: 3.2.0
info:
  title: Kenna Platform CONNECTORS API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: CONNECTORS
paths:
  /connectors:
    get:
      summary: List Connectors
      description: Returns a list of all of your connectors.
      operationId: list-connectors
      security:
      - X-Risk-Token: []
      tags:
      - CONNECTORS
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    connectors:
                    - host: null
                      name: QualysGuard
                      running: false
                      id: 1
                    - host: test.example.com
                      name: JIRA
                      running: false
                      id: 3
              schema:
                type: object
                properties:
                  connectors:
                    $ref: '#/components/schemas/connectors_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /connectors/{id}:
    put:
      summary: Update Connector
      description: Updates the attributes of a connector by given ID.
      operationId: update-connector
      security:
      - X-Risk-Token: []
      tags:
      - CONNECTORS
      parameters:
      - name: id
        in: path
        description: The connector ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: true
              schema:
                $ref: '#/components/schemas/success_put_response_schema'
        '422':
          description: '422'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connector_request_body_schema'
components:
  schemas:
    connectors_get_response_schema:
      type: array
      items:
        type: object
        properties:
          host:
            type: string
            description: The connector host.
            example: qualys.example.com
          name:
            type: string
            description: The connector name.
            example: QualysGuard
          running:
            type: boolean
            description: The connector run status.
            example: false
          id:
            type: integer
            description: The connector ID used in other connector APIs.
            example: 1
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    connector_request_body_schema:
      type: object
      properties:
        name:
          type: string
          description: The name used to identify this connector in Cisco Vulnerability Management.
        host:
          type: string
          description: The hostname of your vulnerability scanner (if applicable).
        username:
          type: string
          description: The username of an account on your vulnerability scanner (if applicable).
        password:
          type: string
          description: The password of an account on your vulnerability scanner (if applicable).
        api_key:
          type: string
          description: The API key used to access your vulnerability scanner (if applicable).
        scan_policy:
          type: string
          description: The stored policy the vulnerability scanner uses for this connector.
        scan_list:
          type: string
          description: The list of scans with this connector (if applicable). List is a comma separated string, or null.
    success_put_response_schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
