openapi: 3.2.0
info:
  title: Kenna Platform AUDIT LOGS API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: AUDIT LOGS
paths:
  /audit_logs/:
    get:
      summary: Audit Log Search
      description: 'Returns a compressed (gzip) JSON lines file with all entries for the specified date range. If there are no audit logs for the specified period, the returned file will have no content. The date is in an ISO 8601 format. Only the day portion (YYYY-MM-DD) is used for both start_date and end_date.


        For more details, refer to Downloading Export Files.'
      operationId: audit-log-search
      security:
      - X-Risk-Token: []
      tags:
      - AUDIT LOGS
      parameters:
      - name: start_date
        in: query
        description: The start date of the period you want to receive audit logs from. Must be less than or equal to end_date. <b>Required<b>.
        schema:
          type: string
      - name: end_date
        in: query
        description: The end date of the period you want to receive audit logs from. Must be greater than or equal to start_date. The date must be a full day before the current date. <b>Required<b>.
        schema:
          type: string
      responses:
        '200':
          description: '200'
        '422':
          description: '422'
          content:
            application/gzip:
              examples:
                example_0:
                  value:
                    success: 'false'
                    error: unprocessable_entity
                    message: end_date must be one full day before the current date UTC
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
