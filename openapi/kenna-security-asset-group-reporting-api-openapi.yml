          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/total_past_due_vulnerabilities_by_risk_level:
    get:
      summary: Total Past Due Vulnerabilities by Risk Level
      description: Returns the count of vulnerabilities for an asset group that are past their assigned due dates, sorted by high, medium and low risk vulnerabilities.
      operationId: total-past-due-vulnerabilities-by-risk-level
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: A risk meter
                    total_past_due_vulnerabilities_by_risk_level:
                      high: 0
                      medium: 1
                      low: 2300
              schema:
                $ref: '#/components/schemas/asset_groups_total_past_due_vulns_by_risk_level_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/vulnerabilities_by_due_date:
    get:
      summary: Vulnerabilities by Due Date
      description: Returns the count of vulnerabilities for a given Asset Group categorized by when they are due.
      operationId: vulnerabilities-by-due-date
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: A risk meter
                    vulnerabilities_by_due_date:
                    - name: Due in 30+ Days
                      count: 0
                    - name: Due in 0 to 30 Days
                      count: 0
                    - name: Past Due 1 to 30 Days
                      count: 67
                    - name: Past Due 30 to 60 Days
                      count: 29
                    - name: Past Due 60 to 90 Days
                      count: 0
                    - name: Past Due 90+ Days
                      count: 89446
              schema:
