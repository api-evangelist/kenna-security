      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The ISO timestamp of the start date of the period you want to report on.  Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO timestamp of the end date of the period you want to report on.  Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: A risk meter
                    risk_accepted_over_time:
                      '2021-06-22':
                        low: 101
                        medium: 6
                        high: 1
                      '2021-06-23':
                        low: 101
                        medium: 4
                        high: 0
                      '2021-06-24':
                        low: 101
                        medium: 0
                        high: 0
              schema:
                $ref: '#/components/schemas/asset_groups_risk_accepted_over_time_schema'
        '400':
