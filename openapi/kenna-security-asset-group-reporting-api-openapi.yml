          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /clients/refresh_reports:
    post:
      summary: Refresh Reporting Data
      description: Refresh all reporting data. Only one client report refresh can be run at a time. If the scheduled client report refresh or a manual refresh is already running, you will not be able to manually start a new one until the one that is currently running is finished.
      operationId: refresh-reporting-data
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: Client report refresh started
              schema:
                $ref: '#/components/schemas/message_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    error: unprocessable_entity
                    message: There is currently a client report refresh running
                    success: 'false'
              schema:
                $ref: '#/components/schemas/error_response'
  /clients/refresh_reports_status:
    get:
      summary: Get Refresh Reporting Status
      description: Get the status of the reporting data refresh. Only one client report refresh can be run at a time. If the scheduled client report refresh or a manual refresh is already running, you will not be able to manually start a new one until the one that is currently running is finished.
      operationId: get-refresh-reporting-status
