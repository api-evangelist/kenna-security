openapi: 3.2.0
info:
  title: Kenna Platform ASSET GROUP REPORTING API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: ASSET GROUP REPORTING
paths:
  /asset_groups/{id}/report_query/findings/historical_mean_time_to_remediate_by_risk_level:
    get:
      summary: Historical Mean Time To Remediate Findings by Risk Level
      description: Returns a list of Mean Time To Remediate (MTTR) findings in days based on the Risk Level for the provided Asset Group ID.
      operationId: asset-groups-findings-historical-mean-time-to-remediate-by-risk-level
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group identification number.
        required: true
        schema:
          type: integer
      - name: all_time
        in: query
        description: Setting this parameter to any value will retrieve the MTTR for the asset group for its whole lifetime. This parameter overrides the start_date and end_date parameters.
        schema:
          type: boolean
      - name: start_date
        in: query
        description: The ISO-8601 timestamp (YYYY-MM-DD) of the start date of the period you want to report on. Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO-8601 timestamp (YYYY-MM-DD) of the end date of the period you want to report on. Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: test asset group
                    mttr:
                      All findings: 10
                      High risk: 0
                      Medium risk: 4
                      Low risk: 6
              schema:
                $ref: '#/components/schemas/asset_groups_findings_mttr_by_risk_level_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/historical_avg_days_open_vulnerabilities_by_risk_level:
    get:
      summary: Average Days Open by Risk Level Over Time
      description: Returns the average days open of vulnerabilities by risk status in each level (low, medium, and high) for a given Asset Group over time.
      operationId: average-days-open-by-risk-level-over-time
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The ISO timestamp of the start date of the period you want to report on.  Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO timestamp of the end date of the period you want to report on.  Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: A risk meter
                    historical_avg_days_open_vulnerabilities_by_risk_level:
                      '2020-05-24':
                        low: 9
                        medium: 6
                        high: 3
                      '2020-05-25':
                        low: 9
                        medium: 6
                        high: 3
                      '2020-05-26':
                        low: 9
                        medium: 6
                        high: 2
              schema:
                $ref: '#/components/schemas/asset_groups_average_vuln_counts_by_risk_level_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/historical_false_positives_by_risk_level:
    get:
      summary: False Positives by Risk Level Over Time
      description: Returns the count of vulnerabilities manually marked as false positive for a given date range, grouped by risk level.
      operationId: false-positive-by-risk-level-over-time
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The ISO timestamp of the start date of the period you want to report on.  Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO timestamp of the end date of the period you want to report on.  Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: A risk meter
                    historical_false_positives_by_risk_level:
                      '2020-05-24':
                        low: 5
                        medium: 2
                        high: 1
                      '2020-05-25':
                        low: 5
                        medium: 2
                        high: 0
                      '2020-05-26':
                        low: 5
                        medium: 0
                        high: 0
              schema:
                $ref: '#/components/schemas/asset_groups_false_positive_by_risk_level_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/historical_mean_time_to_remediate_by_risk_level:
    get:
      summary: Historical Mean Time To Remediate Vulnerabilities by Risk Level
      description: Returns a list of Mean Time To Remediate (MTTR) vulnerabilities in days by Risk Level specified by the Asset Group ID.
      operationId: historical-mean-time-to-remediate-by-risk-level
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: all_time
        in: query
        description: Setting this parameter to any value will retrieve the MTTR for the asset group for its whole lifetime. This parameter overrides the start_date and end_date parameters.
        schema:
          type: boolean
      - name: start_date
        in: query
        description: The ISO-8601 timestamp (YYYY-MM-DD) of the start date of the period you want to report on. Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO-8601 timestamp (YYYY-MM-DD) of the end date of the period you want to report on. Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: name
                    mttr:
                      All vulnerabilities: 12
                      High risk: 10
                      Medium risk: 11
                      Low risk: 17
              schema:
                $ref: '#/components/schemas/asset_groups_mttr_by_risk_level_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/historical_open_vulnerability_count_by_risk_level:
    get:
      summary: Historical Vulnerability Risk Category Counts
      description: Returns a list of the historical Vulnerability Risk Category ("High", "Medium", "Low") counts for the Asset Group ID provided. If a start or end date is not provided, this endpoint defaults to returning data for all time for the specified Asset Group.
      operationId: historical-vulnerability-risk-category-counts
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The ISO timestamp of the start date of the period you want to report on.  Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO timestamp of the end date of the period you want to report on.  Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 5500
                    name: A risk meter
                    historical_vulnerability_count_by_risk:
                      '2017-07-02':
                        low: 440
                        medium: 330
                        high: 100
                      '2017-07-03':
                        low: 440
                        medium: 320
                        high: 50
                      '2017-07-04':
                        low: 438
                        medium: 300
                        high: 42
              schema:
                $ref: '#/components/schemas/asset_groups_vulnerability_count_by_risk_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/historical_past_due_vulnerabilities_by_risk_level:
    get:
      summary: Past Due Vulnerabilities by Risk Level Over Time
      description: Returns the count of vulnerabilities that are past their due date for a given date range, grouped by risk level.
      operationId: past-due-vulnerabilities-by-risk-level-over-time
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The ISO timestamp of the start date of the period you want to report on.  Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO timestamp of the end date of the period you want to report on.  Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 183
                    name: A risk meter
                    historical_past_due_vulnerabilities_by_risk_level:
                      '2020-05-24':
                        low: 24048
                        medium: 2
                        high: 1
                      '2020-05-25':
                        low: 240485
                        medium: 2
                        high: 0
                      '2020-05-26':
                        low: 240481
                        medium: 0
                        high: 0
              schema:
                $ref: '#/components/schemas/asset_groups_historical_past_due_vulns_by_risk_level_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/historical_risk_meter_scores:
    get:
      summary: Historical Risk Meter Scores
      description: Returns a list of the historical Risk Meter scores for the Asset Group ID provided. If a start or end date is not provided, this endpoint defaults to returning risk meter scores for all time for the specified Asset Group.
      operationId: historical-risk-meter-scores
      security:
      - X-Risk-Token: []
      tags:
      - ASSET GROUP REPORTING
      parameters:
      - name: id
        in: path
        description: The asset group or risk meter ID.
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The ISO timestamp of the start date of the period you want to report on.  Defaults to 30 days ago.
        schema:
          type: string
      - name: end_date
        in: query
        description: The ISO timestamp of the end date of the period you want to report on.  Defaults to today.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 5500
                    name: A risk meter
                    risk_meter_scores:
                      '2021-09-21': 800
                      '2021-09-22': 400
                      '2021-09-23': 300
                      '2021-09-24': 200
                      '2021-09-25': 100
              schema:
                $ref: '#/components/schemas/asset_groups_risk_meter_scores_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /asset_groups/{id}/report_query/risk_accepted_over_time:
    get:
      summary: Risk Accepted by Risk Level Over Time
      description: Returns the count of vulnerabilities with risk-accepted status in each level (low, medium, and high) for a given Asset Group over time.
      operationId: risk-accepted-by-risk-level-over-time
      security:
