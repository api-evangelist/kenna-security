paths:
  /entitlements/overage:
    get:
      summary: Get Overage Status
      description: Returns the client entitlements overage status.
      operationId: entitlements-overage
      security:
      - X-Risk-Token: []
      tags:
      - ENTITLEMENTS
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    overage_status: false
              schema:
                type: object
                properties:
                  overage_status:
                    type: boolean
                    example: 'false'
                    description: Indicates if the client is in overage.
components:
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
