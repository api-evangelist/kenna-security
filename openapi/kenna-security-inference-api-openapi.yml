            type: string
            example: Rocky Linux release 8.4 (Green Obsidian)
            description: OS version or package version
          epoch:
            type: string
            example: '0'
            description: Package epoch value
          install_time:
            type: string
            example: '1650475202'
            description: Unix Timestamp
