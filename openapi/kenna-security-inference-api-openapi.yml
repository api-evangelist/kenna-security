  /inference/v3/os_query:
    post:
      summary: Vulnerability Inference for Windows, Darwin (macOS) and Linux Systems
      description: "<p>Returns a list of known vulnerabilities for a given operating system such as Windows, Mac OS and Linux Systems.</p><div class=\"pin\"><blockquote class=\"callout callout_warn\" theme=\"\U0001F6A7\"><h3 class=\"callout-heading false\"><span class=\"callout-icon\">\U0001F6A7</span><p>Restricted Access</p></h3><p>This API endpoint is a premium feature for select partners.</p></blockquote></div><p>To generate a payload on the client machine, please review the <a href=\"https://apidocs.kennasecurity.com/docs/api-v3-specification\" target=\"_blank\">Getting Started with Vulnerability Inference V3</a> guides, and select your client operating system. For example, for Darwin Systems (macOS), run this osquery command from your command line shell:<pre><code>osqueryi --json \"SELECT * FROM os_version;\"</code></pre></p><p>The command should produce JSON output that looks like this:<pre><code>[\n  {\n    \"major\": \"10\",\n    \"name\": \"Mac OS X\",\n    \"platform_like\": \"\
        darwin\",\n    \"patch\": \"3\",\n    \"platform\": \"darwin\",\n    \"version\": \"10.15.1\",\n    \"build\": \"19D76\",\n    \"codename\": \"\",\n    \"arch\": \"x86_64\",\n    \"minor\": \"15\"\n  }\n]</code></pre></p><p>The above output can be used in the POST request.</p>"
      operationId: v3-os-inference
      security:
      - X-Risk-Token: []
      tags:
      - INFERENCE V3 - Osquery
