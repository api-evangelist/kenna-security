      - software
      properties:
        arch:
          type: string
          description: The architecture of the operating system. Currently only `64-bit` is supported. This parameter can be omitted for Linux.
        os_type:
          type: string
          description: The operating system type. Supported values include CENTOS, SLES, RHEL, UBUNTU or WINDOWS.
