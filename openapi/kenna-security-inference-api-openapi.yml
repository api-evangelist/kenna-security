            type: string
            example: '8'
            description: Major release version
          minor:
            type: string
            example: '4'
            description: Minor release version
          name:
            type: string
            example: Rocky Linux
            description: Distribution, product or package name
          patch:
            type: string
            example: '0'
            description: Optional patch release
          platform:
            type: string
            enum:
            - rhel
            - ubuntu
            - amzn
            - sles
            - opensuse-leap
            - alma
            - oracle
            example: rhel
            description: OS Platform or ID
          platform_like:
            type: string
            example: rhel
            description: Closely related platforms
