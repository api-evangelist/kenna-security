                      scanner_description: 'QueryPath: JavaScript\Cx\JavaScript High Risk\Client DOM XSS Version:1; Language: JavaScript; Categories: PCI DSS v3.2;PCI DSS (3.2) - 6.5.7 - Cross-site scripting (XSS),OWASP Top 10 2013;A3-Cross-Site Scripting (XSS),FISMA 2014;Access Control,NIST SP 800-53;SI-15 Information Output Filtering (P0),OWASP Top 10 2017;A7-Cross-Site Scripting (XSS)'
                Vulnerabilities (slim=false) OK:
                  value:
                    meta:
                      total_count: 1
                    vulnerabilities:
                    - id: 316935
                      status: open
                      closed_at: null
                      created_at: '2022-09-07T18:46:14Z'
                      due_date: null
                      notes: null
                      port: []
                      priority: 10
                      identifiers:
                      - CWE-391
                      last_seen_time: '2022-09-09T17:33:38.000Z'
                      scanner_score: 2
                      fix_id: 222
                      scanner_vulnerabilities:
                      - port: null
                        external_unique_id: '57'
                        open: true
                      asset_id: 6790
                      connectors:
                      - name: Veracode XML
                        id: 33
                        connector_definition_name: Veracode XML
                        vendor: Veracode
                      service_ticket: null
                      urls:
                        asset: api.kennasec.com/assets/6790
                      solution: <h4>Recommendations</h4><p>Never ignore return codes, assuming that a function will always succeed.  Check for and handle all possible return codes to ensure that all scenarios are covered, including boundary or edge conditions.  Subject the application to extensive testing to discover some of the possible instances of where and how errors or return values are not handled.</p><p>Use a standard exception handling mechanism to be sure that the application properly handles all types of processing errors. Do not allow the application to throw errors up to the application container, generally the web application server.   </p>
