      type: object
      properties:
        score:
          type: number
          format: float
          description: Numerical score indicates the severity of a vulnerability relative to other vulnerabilities.
          example: 7.5
        exploit_subscore:
          type: number
          format: float
          description: Numerical score reflects the ease and technical means by which the vulnerability can be exploited. The Exploitability sub-score equation is derived from the Base Exploitability metrics.
          example: 3.9
        impact_subscore:
          type: number
          format: float
          description: Numerical score reflects the direct consequence of a successful exploit, and represents the consequence to the thing that suffers the impact. The Impact sub-score equation is derived from the Base Impact metrics.
          example: 3.6
        temporal_score:
          type: number
          format: float
          description: Numerical score reflects the characteristics of a vulnerability that may change over time but not across user environments.
          example: 9.4
