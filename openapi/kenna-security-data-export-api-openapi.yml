openapi: 3.2.0
info:
  title: Kenna Platform DATA EXPORT API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: DATA EXPORT
paths:
  /data_exports:
    get:
      summary: Retrieve Data Export
      description: 'Get all results from a previously created export using the search_id returned in the

        Request Data Export

        API response.


        The response is gzipped and the content of the response data is determined by the

        model field in export_settings in the

        Request Data Export

        API body parameters.

        Usually, the response is stored in a file and gzipped.


        If your search has not been completed you will receive an Export Incomplete Response to

        indicate that we are still processing your search results.


        The response example shows an uncompressed response for asset exports; whereas, the response

        schema shows the options of returning asset, fix, or vulnerability information in its uncompressed format.


        For more details, refer to

        Downloading Export Files

        guide, "Acquiring the Download File" section.'
      operationId: retrieve-data-export
      security:
      - X-Risk-Token: []
      tags:
      - DATA EXPORT
      parameters:
      - name: search_id
        in: query
        example: '2358'
        description: An ID returned by Request Data Export that identifies the data_export to be retrieved.
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/gzip:
              examples:
