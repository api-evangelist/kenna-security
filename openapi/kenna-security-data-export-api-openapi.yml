              schema:
                oneOf:
                - type: object
                  properties:
                    meta:
                      description: The `xml` and `json` data formats include count metadata; `jsonl` does not--the number of records can be calculated by calculating the number of lines in the file.
                      type: object
                      properties:
                        total_count:
                          type: integer
                          description: The total number of records in the export.
                    assets:
                      type: array
                      items:
                        $ref: '#/components/schemas/export_get_asset_response_schema'
                - type: object
                  properties:
                    meta:
                      description: The `xml` and `json` data formats include count metadata; `jsonl` does not--the number of records can be calculated by calculating the number of lines in the file.
                      type: object
                      properties:
                        total_count:
                          type: integer
                          description: The total number of records in the export.
                    fixes:
                      type: array
                      items:
                        $ref: '#/components/schemas/export_get_fix_response_schema'
                - type: object
                  properties:
                    meta:
                      description: The `xml` and `json` data formats include count metadata; `jsonl` does not--the number of records can be calculated by calculating the number of lines in the file.
                      type: object
                      properties:
                        total_count:
                          type: integer
                          description: The total number of records in the export.
                    vulnerabilities:
                      type: array
                      items:
                        $ref: '#/components/schemas/export_get_vulnerability_response_schema'
                - type: object
                  properties:
                    meta:
                      description: The `xml` and `json` data formats include count metadata; `jsonl` does not--the number of records can be calculated by calculating the number of lines in the file.
                      type: object
                      properties:
                        total_count:
                          type: integer
                          description: The total number of records in the export.
                    findings:
                      type: array
                      items:
                        $ref: '#/components/schemas/export_get_finding_response_schema'
        '206':
          description: Partial Content
          content:
            application/json:
              examples:
                currently_enqueued:
                  value:
                    message: The export is currently enqueued. Try again later.
                    success: 'true'
                currently_processing:
                  value:
                    message: The export is currently processing. Try again later.
                    success: 'true'
            application/gzip:
              schema:
                $ref: '#/components/schemas/error_response'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                export_not_found:
                  value:
                    error: Bad Request
                    message: Export not found.
                    success: 'false'
                failed_to_retrieve:
                  value:
                    error: Bad Request
                    message: Cannot retrieve a failed or cancelled export.
                    success: 'false'
            application/gzip:
              schema:
                $ref: '#/components/schemas/error_response'
        '410':
          description: Resource not available
          content:
            application/json:
              examples:
                export_expired:
                  value:
                    error: Resource gone
                    message: This search has expired and is no longer available
                    success: 'false'
            application/gzip:
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                cannot_get_data:
                  value:
                    error: Internal Server Error
                    message: There was an error getting your search data. Please contact tech support for more details.
                    success: 'false'
            application/gzip:
              schema:
                $ref: '#/components/schemas/error_response'
    post:
      summary: Request Data Export
      description: 'Filters client data by a given set of search parameters below and ones in the respective search API

        endpoints.The request is processed in the background.


        User must specify the format of the data, including the model

        type (asset, fix, vulnerability or finding), and data

        format (json, jsonl, xml).

        For asset and vulnerability exports, the defaults are open vulnerabilities with active assets.

        For finding exports, the default is open findings with active assets.


        User can also specify fields in export_settings to return only the

        fields that the user is interested in.For more details, please refer to the

        Downloading Export Files

        guide, "Selecting Your Fields" section.


        Due to the async nature of the request, a search_id is returned which can be used to get the

        results of the search once the processing of the request is complete. Search IDs are valid

        for 30 days after the initial request is made.


        The model field in export_settings is referred to as "model" in the

        filter body parameters below. Each filter body parameter contains information on which model

        or models the filter body parameter is valid.'
      operationId: request-data-export
      security:
      - X-Risk-Token: []
      tags:
      - DATA EXPORT
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    search_id: 42
                    record_count: 2001
              schema:
                $ref: '#/components/schemas/search_id_post_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                fields_with_slim:
                  value:
                    success: false
                    message: Picked fields should not be applied to slim exports. Please check API documentation.
                badly_formed_fields:
                  value:
                    success: false
                    message: Requested fields should be an array. Please check API documentation.
              schema:
                $ref: '#/components/schemas/error_response'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                non_existent_field:
                  value:
                    success: false
                    message: Unable to apply fields { non_existent_field } to assets model. Please check API documentation.
                duplicate_fields:
                  value:
                    success: false
                    message: Duplicate fields { tags } found. Please check API documentation.
              schema:
                $ref: '#/components/schemas/search_id_post_422_response_schema'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/export_settings_request_body_schema'
  /data_exports/kill:
    put:
      summary: Kill Running Data Export
      description: 'Kill a running export by specifying the export ID.


        The following messages are currently returned with the appropriate HTTP response status code:


        HTTP Status Code Message


        200 Terminating client data export.


        400 Export not found.


        400 Cannot kill an already cancelled, failed, or completed export.


        500 There was an error while killing the export. Please contact tech support for more details.


        Error handling in client code should be based on the HTTP status code.'
      operationId: kill-running-data-export
      security:
      - X-Risk-Token: []
      tags:
      - DATA EXPORT
      parameters:
      - name: export_id
        in: query
        example: '2358'
        description: The `search_id` returned by [Request Data Export](https://apidocs.kennasecurity.com/reference/request-data-export) that identifies the data_export to terminate.
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: Terminating client data export.
              schema:
                $ref: '#/components/schemas/message_put_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: Export not found.
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: '500'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: There was an error while killing the export. Please contact tech support for more details.
              schema:
                $ref: '#/components/schemas/error_response'
  /data_exports/status:
    get:
      summary: Check Data Export Status
      description: 'Get the status message from a previously created asynchronous search using the search_id.


        The following messages are currently returned with the appropriate HTTP response status code:


        HTTP Status Code Message


        200 Export ready for download


        206 The export is currently enqueued. Try again later.


        206 The export is currently processing. Try again later.


        404 No search found.


        410 The search has expired and is no longer available.


        500 There was an error getting your search data. Please contact tech support for more details.


        Error handling in client code should be based on the HTTP status code.'
      operationId: check-data-export-status
      security:
      - X-Risk-Token: []
      tags:
      - DATA EXPORT
      parameters:
      - name: search_id
        in: query
        example: '2358'
        description: An ID returned by Request Data Export that identifies the data_export.
        schema:
          type: integer
      responses:
        '200':
          description: Export complete
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: Export ready for download
              schema:
                $ref: '#/components/schemas/export_status_get_response_schema'
        '206':
          description: Export not complete
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: The export is currently processing. Try again later.
              schema:
                $ref: '#/components/schemas/export_status_get_response_schema'
        '404':
          description: Cannot find a search
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: No search found
              schema:
                $ref: '#/components/schemas/error_response'
        '410':
          description: Expired search
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: The search has expired and is no longer available.
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: Unexpected error
          content:
            application/json:
              examples:
                example_0:
                  value:
                    message: There was an error getting your search data. Please contact tech support for more details.
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    export_get_vulnerability_response_schema:
      type: object
      title: exported_vulnerability
      properties:
        id:
          type: integer
          example: 709836
        status:
          type: string
          enum:
          - closed
          - closed_by_human
          - false_positive_by_human
          - open
          - open_by_api
          - risk_accepted_by_human
          example: open
        closed_at:
          type: string
          format: date-time
          example: '2021-08-12T03:14:57Z'
        created_at:
          type: string
          format: date-time
          example: '2021-02-23T13:38:57Z'
        due_date:
          type: string
          format: date-time
          example: '2021-08-01T12:00:00Z'
        notes:
          type: string
        port:
          type: array
          items:
            type: string
        priority:
          type: integer
          example: 10
        identifiers:
          type: array
          items:
            type: string
            example: '133531'
        last_seen_time:
          type: string
          format: date-time
          example: '2021-02-04T21:47:50.000Z'
        scanner_score:
          type: integer
          example: 4
        fix_id:
          type: integer
          example: 1841225
        scanner_vulnerabilities:
          type: array
          items:
            type: object
            properties:
              port: {}
              external_unique_id:
                type: string
                example: '133531'
              open:
                type: boolean
                example: true
        asset_id:
          type: integer
          example: 12312
        connectors:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 157604
              name:
                type: string
                example: Nessus API Importer
              connector_definition_name:
                type: string
                example: Nessus API Importer
              vendor:
                type: string
                example: Tenable
        service_ticket:
          $ref: '#/components/schemas/service_ticket_response_schema'
        urls:
          type: object
          properties:
            asset:
              type: string
              example: api.kennasecurity.com/assets/12312
        solution:
          type: string
          example: Upgrade to macOS 10.13.6, 10.14.6, 10.15.3 or later
        patch:
          type: boolean
          example: true
        patch_published_at: {}
        cve_id:
          type: string
          example: CVE-2019-11043
        cve_description:
          type: string
          example: In PHP versions 7.1.x below 7.1.33, 7.2.x below 7.2.24 and 7.3.x below 7.3.11 in certain configurations of FPM setup it is possible to cause FPM module to write past allocated buffers into the space reserved for FCGI protocol data, thus opening the possibility of remote code execution.
        cve_published_at:
          type: string
          example: '2019-10-28T15:15:00.000Z'
        description:
          type: string
          example: <p>SSI Injection (Server-side Include) is a server-side exploit technique that allows an attacker to send code into a web application, which will later be executed locally by the web server. SSI Injection exploits a web application's failure to sanitize user-supplied data before they are inserted into a server-side interpreted HTML file.</p><p>Before serving an HTML web page, a web server may parse and execute Server-side Include statements before providing it to the client. In some cases (e.g. message boards, guest books, or content management systems), a web application will insert user-supplied data into the source of a web page.</p><p>If an attacker submits a Server-side Include statement, he may have the ability to execute arbitrary operating system commands, or include a restricted file's contents the next time the page is served. This is performed at the permission level of the web server user.</p><p> </p><h3>Example</h3><p>The following SSI tag can allow an attacker to get the root directory listing on a UNIX based system.</p><p> </p><p>&lt;!--#exec cmd="/bin/ls /" --&gt;</p><p> </p><p>The following SSI tag can allow an attacker to obtain database connection strings, or other sensitive data contained within a .NET configuration file.</p>
        wasc_id:
          type: string
          example: WASC-36
        severity:
          type: integer
          example: 8
        threat:
          type: integer
          example: 10
        popular_target:
          type: boolean
          example: false
        active_internet_breach:
          type: boolean
          example: true
        easily_exploitable:
          type: boolean
          example: true
        malware_exploitable:
          type: boolean
          example: false
        remote_code_execution:
          type: boolean
          example: true
        predicted_exploitable:
          type: boolean
          example: false
        platform_types:
          type: array
          items:
            type: string
            enum:
            - application
            - hardware
            - network
            - operating system
          example:
          - application
          - operating system
        cvss_v2:
          $ref: '#/components/schemas/cvss_v2_schema'
        cvss_v3:
          $ref: '#/components/schemas/cvss_v3_schema'
        custom_fields:
          description: 'Array of custom fields matching known custom fields defintions.  Specific custom fields may be picked by requesting a field with the prefix ''custom_fields:'' and name of custom field as a suffix; for example: ''custom_fields:my custom field'''
          type: array
          items:
            type: object
            properties:
              custom_field_definition_id:
                description: ID of the custom field definition associated with the custom field.
                type: integer
                format: int32
                example: '123'
              name:
                description: Name of the custom field
                type: string
                example: my custom field
              value:
                description: Value of the custom field corresponding to the type set within the custom field defintion
                oneOf:
                - type: string
                - type: number
                - type: integer
                - type: boolean
                example: foo
        first_found_on:
          type: string
          format: date-time
          example: '2021-02-23T13:38:57Z'
        top_priority:
          type: boolean
          example: true
        risk_meter_score:
          type: integer
          example: 100
        closed:
          type: boolean
          example: false
        status_changed_at:
          description: (Will not be provided unless requested within `fields`.) Date representing when the status last changed.  If the status has never changed, will be null.
          format: date-time
          example: '2019-06-08'
        details:
          description: (Will not be provided unless requested within `fields`.) Array of details text provided by all connectors reporting the vulnerability.
          type: array
          items:
            type: object
            properties:
              connector_name:
                type: string
                example: Nessus API Importer
              value:
                type: string
                example: File X found at version N
    search_id_post_422_response_schema:
      type: integer
      example: 1
      default: 0
    export_settings_request_body_schema:
      type: object
      properties:
        export_settings:
          type: object
          required:
          - format
          - model
          properties:
            format:
              type: string
              description: The format of the returned data.
              enum:
              - json
              - jsonl
              - xml
              default: jsonl
            model:
              type: string
              description: The type of data requested and returned.
              enum:
              - asset
              - finding
              - fix
              - vulnerability
            slim:
              type: boolean
              description: If `true`, applies a predetermined set of fields consisting of `id`, `status`, `closed_at`, `port`, `status_changed_at`, `last_seen_time`, `asset_id`, `cve_id`, `severity`, `cvss_v2`, `cvss_v3`, and `first_found_on`. This field only applies to the vulnerability model.
              default: false
            fields:
              type: array
              items:
                type: string
              description: 'An array of fields that will be returned in requested export. If empty array is provided, all the supported fields are returned. Supported fields are located in the [Retrieve Data Exports](https://apidocs.kennasecurity.com/reference/retrieve-data-export) API, "Responses" under the appropriate model. The `id` field is always returned. Note: If you use this field to export custom fields, you need to specify the custom field name and prefix it with “custom_fields:”. For example, if you have a custom field named “reopen-date” you would use the following syntax: “custom_fields:reopen-date”'
        id:
          type: array
          items:
            type: integer
          description: '*Valid for asset, vulnerability, finding, and fix models.*  Dependent on the `model`, an array of asset, vulnerability, finding, or fix IDs'
        max_priority:
          type: integer
          description: '*Valid for asset model.*  Search for all assets that have a priority less than this value.'
        max_risk_meter_score:
          type: integer
          description: '*Valid for asset, vulnerability, finding, and fix models.*  Search for all assets that have a risk meter score less than this value.'
        min_priority:
          type: integer
          description: '*Valid for asset model.*  Search for all assets that have a priority greater than this value.'
        min_risk_meter_score:
          type: integer
          description: '*Valid for asset, vulnerability, finding, and fix models.*  Search for all assets that have a risk meter score greater than this value.'
        q:
          type: string
          description: '*Valid for asset, vulnerability, and fix models.*  Additional text search parameters, as documented at: [Cisco Vulnerability Management Search Terms](https://help.kennasecurity.com/hc/en-us/articles/206280593-Kenna-Search-Terms).  Use the section that matches the model.*  Example q=tag:(mytag+AND+thetag).'
        records_updated_since:
          type: string
          description: '*Valid for asset, vulnerability and fix models.*  Supports **Incremental Exports**. It will fetch all records updated since that time. This can be added to both asset and vulnerabilities.  The format can be an offset date ("now-2d") following [this format](https://www.elastic.co/guide/en/elasticsearch/reference/current/common-options.html#date-math), a date ("2020-09-09") or a date-time ("2020-10-10 12:30:00").'
        records_updated_until:
          type: string
          description: '*Valid for asset, vulnerability and fix models.*  Effective only when `records_updated_since` is specified. It will fetch all records updated since `records_updated_since` (inclusive) datetime until `records_update_until` datetime (exclusive). The format is the same to `records_update_since` parameter.'
        status:
          type: array
          items:
            type: string
            enum:
            - active
            - inactive
            - open
            - closed
            - risk accepted
            - false positive
          description: '*Valid for asset, vulnerability, finding, and fix models.*  An array of statuses. For the asset model, ''active'' and ''inactive'' are valid.  The asset model default is ''active''.  For the vulnerability and fix models, ''open'', ''closed'', ''risk accepted'', and ''false positive'' are valid.  The vulnerability and fix models default is ''open''. For the finding model, ''duplicate'', ''false positive'', ''not a security issue'', ''resolved'', ''risk accepted'', ''in progress'', ''new'', ''triaged'', ''open'', ''closed'', and ''all'' are valid.'
        exclude_child_filter:
          type: array
          items:
            type: string
