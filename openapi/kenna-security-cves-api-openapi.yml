openapi: 3.2.0
info:
  title: Kenna Platform CVES API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: CVES
paths:
  /vulnerability_definitions/history:
    get:
      summary: Show CVE History
      description: 'Returns Cisco Vulnerability Management''s CVE score history for one or more CVE identifiers. Customers who have purchased the Vulnerability Intelligence+ API may access any CVE. Customers who have not purchased Vulnerability Intelligence+ API may only access CVEs that correspond to vulnerabilities within their instance.


        🚧

        Restricted Access


        This API endpoint is a premium feature and requires access to the Vulnerability Intelligence+ API to access any CVE.'
      operationId: show-cve-history
      security:
      - X-Risk-Token: []
      tags:
      - CVES
      parameters:
      - name: cves
        in: query
        description: Comma-delimited list of CVE identifiers. The maximum number of CVEs per request is 250.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    CVE-2018-0866:
                      id: 466688
                      risk_meter_score: 82
                      risk_meter_score_history:
                      - changed_at: '2018-02-18T04:01:34.000Z'
                        from: 25
                        to: 28
                      - changed_at: '2018-02-22T03:53:23.000Z'
                        from: 28
                        to: 40
                      - changed_at: '2018-03-14T04:37:36.000Z'
                        from: 40
                        to: 58
                      - changed_at: '2018-03-15T03:50:28.000Z'
                        from: 58
                        to: 52
                      - changed_at: '2018-05-10T03:52:44.000Z'
                        from: 52
                        to: 85
                      - changed_at: '2018-10-31T03:30:24.000Z'
                        from: 85
                        to: 82
                    CVE-2019-0708:
                      id: 505973
                      risk_meter_score: 100
                      risk_meter_score_history:
                      - changed_at: '2019-05-16T01:40:33.000Z'
                        from: 0
                        to: 36
                      - changed_at: '2019-05-16T16:39:27.000Z'
                        from: 36
                        to: 54
                      - changed_at: '2019-05-17T03:25:22.000Z'
                        from: 54
                        to: 50
                      - changed_at: '2019-05-19T03:58:17.000Z'
                        from: 50
                        to: 47
                      - changed_at: '2019-05-21T03:33:09.000Z'
                        from: 47
                        to: 51
                      - changed_at: '2019-05-23T03:32:49.000Z'
                        from: 51
                        to: 58
                      - changed_at: '2019-05-26T03:45:18.000Z'
                        from: 58
                        to: 94
                      - changed_at: '2019-07-31T03:29:30.000Z'
                        from: 94
                        to: 100
                    warning:
                      code: 1
                      message: Customers who have not purchased the Threat API may only access CVEs that correspond to vulnerabilities in their instance
                      unavailable_cve_identifiers:
                      - CVE-2019-0709
                      url: https://apidocs.kennasecurity.com/reference#show-cve-history
              schema:
                $ref: '#/components/schemas/history_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    history_get_response_schema:
      type: object
      additionalProperties:
        type: object
        description: The key is the CVE ID.
        properties:
          id:
            type: integer
            example: 466688
          risk_meter_score:
            type: integer
            example: 82
          risk_meter_score_history:
            type: array
            items:
              type: object
              properties:
                changed_at:
                  type: string
                  format: date-time
                  example: '2018-02-18T04:01:34.000Z'
                from:
                  type: integer
                  example: 25
                to:
                  type: integer
                  example: 28
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
