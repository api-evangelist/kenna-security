openapi: 3.2.0
info:
  title: Kenna Platform ASSET TAGGING API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: ASSET TAGGING
paths:
  /assets/{id}/tags:
    delete:
      summary: Untag an Asset
      description: 'Update a single asset based on ID by removing a tag or tags. Supports either an array of tags, each tag wrapped in single or double quotes, or a single string with a comma separator


        Requests to this endpoint will only remove taggings created through the UI or API.'
      operationId: untag-an-asset
      security:
      - X-Risk-Token: []
      tags:
      - ASSET TAGGING
      parameters:
      - name: id
        in: path
        description: The asset ID.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: '204'
        '422':
          description: '422'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset_tags_schema'
    put:
      summary: Tag an Asset
      description: Update a single asset based on ID by using a tag or tags. Supports either an array of tags, each tag wrapped in single or double quotes, or a single string with a comma separator.
      operationId: tag-an-asset
      security:
      - X-Risk-Token: []
      tags:
      - ASSET TAGGING
      parameters:
      - name: id
        in: path
        description: The asset ID.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: '204'
        '422':
          description: '422'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset_tags_schema'
    get:
      summary: List Tags
      description: Returns a list of tags for a given asset.
      operationId: list-tags
      security:
      - X-Risk-Token: []
      tags:
      - ASSET TAGGING
      parameters:
      - name: id
        in: path
        description: The asset ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    tags:
                    - foo
                    - bar
                    tag_info:
                    - tag_name: foo
                      tag_sources:
                        connectors:
                        - connector_id: 541846
                          last_seen_at: '2022-02-02'
                        api:
                          user_id: 478414
                        ui:
                          user_id: 245244
                    - tag_name: bar
                      tag_sources:
                        connectors:
                        - connector_id: 461843
                          last_seen_at: '2022-01-01'
                        api:
                          user_id: 154315
                        ui:
                          user_id: 758152
              schema:
                $ref: '#/components/schemas/tags_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    asset_tags_schema:
      type: object
      required:
      - asset
      properties:
        asset:
          type: object
          description: Asset information.
          properties:
            tags:
              type: array
              description: A string array of asset tags.
              items:
                type: string
    tags_get_response_schema:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
            example: foo
        tag_info:
          type: array
          items:
            type: object
            properties:
              tag_name:
                type: string
                example: foo
              tag_sources:
                type: object
                properties:
                  connectors:
                    type: array
                    items:
                      type: object
                      properties:
                        connector_id:
                          type: integer
                          example: 541846
                        last_seen_at:
                          type: string
                          example: '2022-02-02'
                  api:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 478414
                  ui:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 245244
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
