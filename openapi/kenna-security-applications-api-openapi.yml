openapi: 3.2.0
info:
  title: Kenna Platform APPLICATIONS API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: APPLICATIONS
paths:
  /applications:
    get:
      summary: List Applications
      description: 'Returns a list of all of your applications.


        Attribute Value


        Maximum Pages Allowed ∞


        Maximum Page Size 100


        Default Page Size 100


        Total Count Present in meta object No


        See the Pagination Section for more details.'
      operationId: list-applications
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATIONS
      parameters:
      - name: page
        in: query
        description: The specific page being requested from 1 to the total number of pages returned in the `meta` object.
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of Applications per page. The default is 100 and the maximum page size is 100.
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    applications:
                    - id: 1
                      name: Demo App
                      repo_url: ''
                      host_name: Demo
                      owner: Demo
                      team_name: Demo
                      business_units: Demo Business Unit
                      notes: ''
                      risk_meter_score: 850
                      vulnerability_count: 916
                      asset_count: 3
                      total_vulnerability_count: 1033
                      external_facing: true
                      priority: 10
                      open_vulnerability_count_by_risk_level:
                        high: 106
                        medium: 162
                        low: 648
                        total: 916
                      historical_risk_meter_scores:
                      - date: '2019-04-03'
                        score: 0
                      - date: '2019-04-04'
                        score: 850
                      identifiers:
                      - Demo App Identifier
                      - Another Demo App ID
                    - id: 2
                      name: Demo App 2
                      repo_url: ''
                      host_name: ''
                      owner: ''
                      team_name: ''
                      business_units: Demo Business Unit
                      notes: ''
                      risk_meter_score: 850
                      vulnerability_count: 916
                      asset_count: 3
                      total_vulnerability_count: 1033
                      external_facing: false
                      priority: 6
                      open_vulnerability_count_by_risk_level:
                        high: 106
                        medium: 162
                        low: 648
                        total: 916
                      historical_risk_meter_scores:
                      - date: '2019-04-06'
                        score: 850
                      - date: '2019-04-09'
                        score: 850
                      identifiers:
                      - Yet another ID
                    meta:
                      page: 1
                      pages: 3
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/application_get_response_schema'
                  meta:
                    $ref: '#/components/schemas/page_metadata'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
    post:
      summary: Create Application
      description: Creates a single Application and returns the record.
      operationId: create-application
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATIONS
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    application:
                      id: 18408
                      name: Demo app
                      repo_url: Demo repo URL
                      host_name: Demo host name
                      owner: Demo owner
                      team_name: Demo team
                      business_units: Demo business units
                      notes: Demo notes
                      risk_meter_score: 0
                      vulnerability_count: 0
                      asset_count: 0
                      total_vulnerability_count: 0
                      external_facing: true
                      priority: 10
                      open_vulnerability_count_by_risk_level:
                        high: 0
                        medium: 0
                        low: 0
                        total: 0
                      historical_risk_meter_scores: []
                      identifiers:
                      - WA-123
              schema:
                $ref: '#/components/schemas/application_post_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/application_request_body_schema'
  /applications/{id}:
    get:
      summary: Show Application
      description: Returns information about a single application by ID.
      operationId: show-application
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATIONS
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    application:
                      id: 1
                      name: Demo App
                      repo_url: ''
                      host_name: Demo
                      owner: Demo
                      team_name: Demo
                      business_units: Demo Business Unit
                      notes: ''
                      risk_meter_score: 850
                      vulnerability_count: 916
                      asset_count: 3
                      total_vulnerability_count: 1033
                      external_facing: true
                      priority: 10
                      open_vulnerability_count_by_risk_level:
                        high: 106
                        medium: 162
                        low: 648
                        total: 916
                      historical_risk_meter_scores:
                      - date: '2019-04-03'
                        score: 0
                      - date: '2019-04-04'
                        score: 850
                      identifiers:
                      - Demo App Identifier
                      - Another Demo App ID
              schema:
                $ref: '#/components/schemas/application_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
    delete:
      summary: Delete Application
      description: Delete an Application using its ID.
      operationId: delete-application
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATIONS
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
    put:
      summary: Update Application
      description: Update a single application's attributes by ID.
      operationId: update-application
      security:
      - X-Risk-Token: []
      tags:
      - APPLICATIONS
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    application:
                      id: 183
                      name: new application name
                      repo_url: app URL
                      host_name: app host
                      owner: new owner
                      team_name: team name
                      business_units: business units
                      notes: some updated notes
                      risk_meter_score: 0
                      vulnerability_count: 0
                      asset_count: 0
                      total_vulnerability_count: 0
                      external_facing: true
                      priority: 7
                      open_vulnerability_count_by_risk_level:
                        high: 0
                        medium: 0
                        low: 0
                        total: 0
                      historical_risk_meter_scores:
                      - date: '2021-05-04'
                        score: 0
                      - date: '2021-05-05'
                        score: 0
                      - date: '2021-05-06'
                        score: 0
                      identifiers:
                      - iOS Traveler
              schema:
                $ref: '#/components/schemas/application_put_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/application_update_request_body_schema'
components:
  schemas:
    page_metadata:
      type: object
      properties:
        meta:
          type: object
          required:
          - page
          - pages
          properties:
            page:
              type: integer
              description: The response current page number.
              default: 1
            pages:
              type: integer
              description: The total number of pages.
              default: 1
            total_count:
              type: integer
              description: The total number of items across all pages.
              default: 1
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    application_update_request_body_schema:
      type: object
      properties:
        application:
          type: object
          properties:
            business_units:
              type: string
              description: Business units for the application
            external_facing:
              type: boolean
              description: Set this to true if your application is external facing.
              default: 'true'
            identifiers:
              type: array
              description: Array of identifiers for the application
              default: []
              items:
                type: string
            host_name:
              type: string
              description: Name of the host where the application is deployed
            name:
              type: string
              description: Name of the application
            notes:
              type: string
              description: Any notes regarding the application
            owner:
              type: string
              description: Name of the application owner
            priority:
              type: integer
              description: The priority of your application, on a scale of 1 (low priority) to 10 (high priority).
              default: '10'
              format: int32
            repo_url:
              type: string
              description: URL to the code repository for the application
            team_name:
              type: string
              description: Name of the team responsible for the application
    application_request_body_schema:
      type: object
      properties:
        application:
          type: object
          required:
          - identifiers
          - name
          properties:
            business_units:
              type: string
              description: Business units for the application
            external_facing:
