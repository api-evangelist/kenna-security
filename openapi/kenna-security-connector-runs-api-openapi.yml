openapi: 3.2.0
info:
  title: Kenna Platform CONNECTOR RUNS API
  description: OpenAPI specification for Kenna Security
  version: '1.0'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.kennasecurity.com
tags:
- name: CONNECTOR RUNS
paths:
  /connectors/{connector_id}/connector_runs/{connector_run_id}:
    get:
      summary: Show Connector Run
      description: Return information about a single connector run by ID.
      operationId: show-connector-run
      security:
      - X-Risk-Token: []
      tags:
      - CONNECTOR RUNS
      parameters:
      - name: connector_id
        in: path
        description: The connector ID.
        required: true
        schema:
          type: integer
      - name: connector_run_id
        in: path
        description: The connector run ID which can be obtained from the List Connectors API or the UI -> Connectors.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    id: 123456
                    start_time: '2020-02-02T03:34:01.000Z'
                    end_time: '2020-02-02T03:34:08.000Z'
                    success: true
                    total_payload_count: 0
                    processed_payload_count: 0
                    failed_payload_count: 0
                    processed_assets_count: 0
                    assets_with_tags_reset_count: 0
                    processed_scanner_vuln_count: 0
                    updated_scanner_vuln_count: 0
                    created_scanner_vuln_count: 0
                    closed_scanner_vuln_count: 0
                    autoclosed_scanner_vuln_count: 0
                    reopened_scanner_vuln_count: 0
                    closed_vuln_count: 0
                    autoclosed_vuln_count: 0
                    reopened_vuln_count: 0
              schema:
                $ref: '#/components/schemas/connector_run_status_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
  /connectors/{id}/connector_runs:
    get:
      summary: List Connector Runs
      description: Returns a list of connector runs for a connector.
      operationId: list-connector-runs
      security:
      - X-Risk-Token: []
      tags:
      - CONNECTOR RUNS
      parameters:
      - name: id
        in: path
        description: The connector ID from the "List Connectors" API.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                  - id: 1
                    start_time: '2020-02-02T03:34:01.000Z'
                    end_time: '2020-02-02T03:34:08.000Z'
                    success: true
                    total_payload_count: 0
                    processed_payload_count: 0
                    failed_payload_count: 0
                    processed_assets_count: 0
                    assets_with_tags_reset_count: 0
                    processed_scanner_vuln_count: 0
                    updated_scanner_vuln_count: 0
                    created_scanner_vuln_count: 0
                    closed_scanner_vuln_count: 0
                    autoclosed_scanner_vuln_count: 0
                    reopened_scanner_vuln_count: 0
                    closed_vuln_count: 0
                    autoclosed_vuln_count: 0
                    reopened_vuln_count: 0
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/connector_run_status_schema'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: false
                    error: not_found
                    message: Connector was not found.
              schema:
                $ref: '#/components/schemas/error_response'
  /connectors/{id}/data_file:
    post:
      summary: Upload Data File
      description: 'Uploads a data file to a file based connector specified by the id.


        The id can be found from the List Connectors API.


        The file format is dependent on the connector specified by the id. In most cases, the file format is the Data Importer (KDI) format. This is a JSON format that specifies assets and vulnerabilities.


        Including the parameter "Content-Type: application/json" in the header will result in a HTTP status code 400.


        If including the parameter "run: true, refer to the response from the Run Connector API.'
      operationId: upload-data-file
      security:
      - X-Risk-Token: []
      tags:
      - CONNECTOR RUNS
      parameters:
      - name: id
        in: path
        example: '6626'
        description: The connector ID.  The connector ID can found in [List Connectors](https://apidocs.kennasecurity.com/reference/list-connectors).
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: With run as `false` and run as `true`
          content:
            application/json:
              examples:
                example_0:
                  value:
                  - success: 'true'
                    connector_run_id: 16180
                  - success: 'true'
                    run_url: https://api.kennasecurity.com/connectors/155304/run
                    data_file: 18878368
              schema:
                oneOf:
                - $ref: '#/components/schemas/file_upload_response_schema'
                - $ref: '#/components/schemas/success_run_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: 'false'
                    error: bad request
                    message: unexpected token
              schema:
                $ref: '#/components/schemas/error_response'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: 'false'
                    error: Unprocessable_entity
                    message: HttpError
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/file_request_body_schema'
  /connectors/{id}/run:
    get:
      summary: Run Connector
      description: Schedules a run of a connector. If file based, it will use the "data_files" parameter if present, or else the most recently uploaded data file.
      operationId: run-connector
      parameters:
      - name: data_files[]
        in: query
        schema:
          type: array
          items:
            type: integer
        description: The data file ID from the Upload Data File API.
      - name: id
        in: path
        description: The connector ID. This can be obtained from the List Connectors API or the UI -> Connectors.
        required: true
        schema:
          type: integer
      security:
      - X-Risk-Token: []
      tags:
      - CONNECTOR RUNS
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: true
                    connector_run_id: 123
              schema:
                $ref: '#/components/schemas/success_run_get_response_schema'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                example_0: {}
              schema:
                $ref: '#/components/schemas/error_response'
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
          description: The HTTP error message.
        message:
          type: string
          description: The specific error message.
        success:
          type: string
          description: Indicates success, usually 'false'.
    success_run_get_response_schema:
      properties:
        connector_run_id:
          type: integer
          format: int32
          description: The connector run ID that is used in subsequent connector APIs invokes.
          example: 123
        success:
          type: string
          description: The connector run status.
          example: 'true'
    file_request_body_schema:
      type: object
      required:
      - file
      properties:
        encoding:
          type: string
          description: Compression encoding of the file input. Currently 'deflate' is the only valid value, which implies Python's `zlib.compressobj()`.  Default is null.
        file:
          type: string
          format: binary
          description: File name to be uploaded to the associated connector.  This is a fully qualifed path name.
          example: /users/kenna/connectors/burp/kdi.json
        run:
          type: boolean
          description: The value `true` implies that the connector will run immediately after the file has been uploaded.  Default is `false`.
    connector_run_status_schema:
      properties:
        id:
          type: integer
          format: int32
          example: '12457'
        start_time:
          type: string
          format: date-time
          example: '2020-02-02T03:34:01.000Z'
        end_time:
          type: string
          format: date-time
          example: '2020-02-02T03:34:08.000Z'
        success:
          type: boolean
          example: true
        total_payload_count:
          type: integer
          format: int32
          example: '458'
        processed_payload_count:
          type: integer
          format: int32
          example: '458'
        failed_payload_count:
          type: integer
          format: int32
          example: '0'
        processed_assets_count:
          type: integer
          format: int32
          example: '256'
        assets_with_tags_reset_count:
          type: integer
          format: int32
          example: '0'
        processed_scanner_vuln_count:
          type: integer
          format: int32
          example: '402'
        updated_scanner_vuln_count:
          type: integer
          format: int32
          example: '102'
        created_scanner_vuln_count:
          type: integer
          format: int32
          example: '42'
        closed_scanner_vuln_count:
          type: integer
          format: int32
          example: '10'
        autoclosed_scanner_vuln_count:
          type: integer
          format: int32
          example: '3'
        reopened_scanner_vuln_count:
          type: integer
          format: int32
          example: '0'
        closed_vuln_count:
          type: integer
          format: int32
          example: '13'
        autoclosed_vuln_count:
          type: integer
          format: int32
          example: '5'
        reopened_vuln_count:
          type: integer
          format: int32
          example: '1'
    file_upload_response_schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data_file:
          type: integer
          format: int32
          example: 16180
        run_url:
          type: string
          example: https://api.kennasecurity.com/connectors/155304/run
  securitySchemes:
    X-Risk-Token:
      type: apiKey
      name: X-Risk-Token
      in: header
